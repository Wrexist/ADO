name: CI

# Mirrors the local gate (scripts/verify.sh → typecheck · lint · test · build) so a PR
# can't merge red. The visual smoke (npm run smoke) needs ACC_TOKEN + a browser and stays
# a local/manual gate — CI does not fabricate a pass for a step it can't honestly run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the checkout. No write scopes, no secrets needed —
# verify runs entirely offline (GitHub sync / Anthropic calls stay off without their tokens).
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20' # engines floor; catch accidental use of newer-only APIs
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Verify
        run: npm run verify
