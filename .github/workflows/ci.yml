name: CI

# Mirrors the local gate (scripts/verify.sh → typecheck · lint · test · build) so a PR
# reports failures. Branch protection must separately require this check. The visual smoke
# a local/manual gate — CI does not fabricate a pass for a step it can't honestly run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the checkout. No write scopes, no secrets needed —
# verify runs entirely offline (GitHub sync / Anthropic calls stay off without their tokens).
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Verify
        run: npm run verify
