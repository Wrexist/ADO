# Desktop release pipeline (docs/DESKTOP.md) — WINDOWS ONLY.
# Two ways to run it:
#   • push a v* tag           → builds ACC-Setup-<version>.exe and publishes to that tag's release
#   • Actions → Run workflow  → same build; electron-builder CREATES the release for the version
#                               in apps/desktop/package.json (publish.releaseType: release) and
#                               uploads the .exe to it. This is the no-tag path used to ship
#                               without pushing a git tag by hand.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # electron-builder creates the release and uploads the installer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # npm lifecycle/build scripts never see the checkout token

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a tag push, refuse a tag whose name doesn't match the desktop package version
      # (mismatched installer names + updater metadata). Skipped for manual runs, where the
      # version comes from package.json and electron-builder mints the matching tag.
      - name: Verify tag matches the desktop package version
        if: github.event_name == 'push'
        working-directory: apps/desktop
        shell: bash
        run: |
          node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('tag '+t+' != package version '+v+' — bump apps/desktop/package.json in the tagged commit');process.exit(1)}"

      - name: Build web bundle
        run: npm run build -w @ado/web

      - name: Bundle desktop main + preload
        run: npm run build -w @ado/desktop

      - name: Package + publish installer
        run: npx electron-builder --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
