# Desktop release pipeline (docs/DESKTOP.md): push a v* tag → three OS runners build the
# web bundle + Electron wrapper and attach installers (+ electron-updater manifests) to the
# GitHub Release for that tag. Download link surface: /setup page + README → releases/latest.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # electron-builder uploads the installers to the tag's Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # npm lifecycle/build scripts never see the checkout token

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A v0.2.0 tag with package version 0.1.0 would publish mismatched installer names
      # and updater manifests — refuse instead of shipping the confusion.
      - name: Verify tag matches the desktop package version
        working-directory: apps/desktop
        shell: bash
        run: |
          node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('tag '+t+' != package version '+v+' — bump apps/desktop/package.json in the tagged commit');process.exit(1)}"

      - name: Build web bundle
        run: npm run build -w @ado/web

      - name: Bundle desktop main + preload
        run: npm run build -w @ado/desktop

      - name: Package + publish installers
        run: npx electron-builder --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
