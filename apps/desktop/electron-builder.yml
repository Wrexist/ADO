# electron-builder config — see docs/DESKTOP.md for the decision record.
# appId is the upgrade/uninstall identity on Windows (NSIS GUID derives from it): NEVER change it.
appId: com.wrexist.acc
productName: AI Control Center
copyright: © 2026 Wrexist
# The on-disk binary/AppImage name. Derived from the package name by default, which strips
# "@ado/desktop" to "@adodesktop" — the "@" is illegal in a Linux executable path and fails
# the AppImage build. A clean fixed name is safe on every platform.
executableName: ai-control-center

# electron-builder needs an EXACT electron version to fetch platform binaries; in a monorepo
# it can't always read it from the hoisted node_modules, so state it here. MUST match the
# pinned "electron" version in package.json (both are 36.9.5) — bump them together on upgrade.
electronVersion: 36.9.5

directories:
  output: release

files:
  - dist/**
  - package.json

# The built web bundle + drizzle migrations ride beside the asar; the server serves the web
# same-origin and applies migrations from ACC_MIGRATIONS_DIR at boot.
extraResources:
  - from: ../web/dist
    to: web
  - from: ../server/drizzle
    to: drizzle

asar: true
# Native module: must live outside the asar to be dlopen-able; electron-builder also
# rebuilds it for Electron's ABI (npmRebuild default) on each platform runner.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned for now → SmartScreen "More info → Run anyway" (documented honestly in
  # docs/DESKTOP.md + README). Azure Artifact Signing slots in here when Isac has an account.
  artifactName: ACC-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ACC-Setup-${version}.${ext}

mac:
  target:
    - dmg
    - zip # electron-updater on macOS reads the zip (only functional once builds are signed)
  category: public.app-category.developer-tools
  artifactName: ACC-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Development
  artifactName: ACC-${version}.${ext}

# Tag push → GitHub Actions builds → installers + latest*.yml land on the tag's Release;
# packaged apps auto-update from there (electron-updater).
# releaseType: release — upload straight to the (already-published) release for the tag. The
# default "draft" is SKIPPED when a published release already exists — which is exactly what
# happens when the release is created from the GitHub UI (that's what mints the tag). With
# "release", every platform job uploads its installer to that release.
publish:
  provider: github
  owner: Wrexist
  repo: ADO
  releaseType: release
